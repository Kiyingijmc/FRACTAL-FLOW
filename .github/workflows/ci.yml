name: FRACTAL FLOW Foundation CI

on:
  push:
    branches: [ "main", "foundation-implementation-1126786977244471853" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml .

      - name: Run Test Suite & Invariant Verification
        run: |
          pytest
