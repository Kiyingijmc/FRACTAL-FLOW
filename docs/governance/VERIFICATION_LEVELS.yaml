verification_levels:
  E0:
    name: "Agent Assertion"
    level: 0
    description: "Self-attested statement or claim generated by an implementation agent or developer."
    authority: "informational"
    satisfies_acceptance: false

  E1:
    name: "Agent-Generated Test"
    level: 1
    description: "Unit or integration tests authored by the implementation actor."
    authority: "local_test"
    satisfies_acceptance: false

  E2:
    name: "Repository-Local Verification"
    level: 2
    description: "Full local test suite, static analysis, type check, and format check execution on developer host."
    authority: "local_verifier"
    satisfies_acceptance: false

  E3:
    name: "Independent Verification"
    level: 3
    description: "Verification conducted by an independent actor or verification runner separate from implementation."
    authority: "independent_verifier"
    satisfies_acceptance: true

  E4:
    name: "Exact-Head CI"
    level: 4
    description: "Automated verification executed in isolated CI runner on exact commit HEAD."
    authority: "ci_runner"
    satisfies_acceptance: true

  E5:
    name: "Adversarial Verification"
    level: 5
    description: "Adversarial test suite and fault injection verification proving robustness against edge cases."
    authority: "adversarial_verifier"
    satisfies_acceptance: true

  E6:
    name: "Post-Merge Verification"
    level: 6
    description: "Continuous post-merge monitoring and reconciliation verification."
    authority: "post_merge_verifier"
    satisfies_acceptance: true
