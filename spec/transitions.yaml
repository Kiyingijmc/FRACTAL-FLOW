transitions:
  SwingState:
    SWING_NONE: [SWING_CANDIDATE]
    SWING_CANDIDATE: [SWING_CONFIRMED, SWING_NONE]
    SWING_CONFIRMED: [SWING_PROTECTED, SWING_BROKEN]
    SWING_PROTECTED: [SWING_BROKEN]
    SWING_BROKEN: []

  BreakState:
    BREAK_NONE: [BREAK_CANDIDATE]
    BREAK_CANDIDATE: [BREAK_CONFIRMED, FAILED_BREAK, BREAK_NONE]
    BREAK_CONFIRMED: [BREAK_ESTABLISHED, FAILED_BREAK]
    BREAK_ESTABLISHED: [BREAK_NONE]
    FAILED_BREAK: [BREAK_NONE]

  StructuralDamageState:
    INTACT: [DAMAGE_CANDIDATE, DAMAGE_CONFIRMED, STRUCTURE_BROKEN]
    DAMAGE_CANDIDATE: [DAMAGE_CONFIRMED, INTACT]
    DAMAGE_CONFIRMED: [STRUCTURE_BROKEN, RECLAIM_CANDIDATE]
    STRUCTURE_BROKEN: [RECLAIM_CANDIDATE]
    RECLAIM_CANDIDATE: [RECLAIM_CONFIRMED, STRUCTURE_BROKEN]
    RECLAIM_CONFIRMED: [INTACT]

  VolatilityState:
    VOL_UNKNOWN: [VOL_NORMAL, VOL_COMPRESSION, VOL_EXPANSION, VOL_EXTREME]
    VOL_NORMAL: [VOL_COMPRESSION, VOL_EXPANSION, VOL_EXTREME, VOL_UNKNOWN]
    VOL_COMPRESSION: [VOL_NORMAL, VOL_EXPANSION, VOL_EXTREME, VOL_UNKNOWN]
    VOL_EXPANSION: [VOL_NORMAL, VOL_EXTREME, VOL_COLLAPSE, VOL_UNKNOWN]
    VOL_EXTREME: [VOL_COLLAPSE, VOL_EXPANSION, VOL_NORMAL, VOL_UNKNOWN]
    VOL_COLLAPSE: [VOL_NORMAL, VOL_COMPRESSION, VOL_UNKNOWN]

  DataQualityState:
    DATA_BOOT: [DATA_VALIDATING, DATA_UNAVAILABLE]
    DATA_VALIDATING: [DATA_NORMAL, DATA_DEGRADED, DATA_STALE, DATA_CORRUPTED, DATA_UNAVAILABLE, DATA_VALID]
    DATA_NORMAL: [DATA_VALIDATING, DATA_DEGRADED, DATA_STALE, DATA_CORRUPTED, DATA_UNAVAILABLE, DATA_VALID]
    DATA_DEGRADED: [DATA_VALIDATING, DATA_NORMAL, DATA_STALE, DATA_CORRUPTED, DATA_UNAVAILABLE, DATA_VALID]
    DATA_STALE: [DATA_VALIDATING, DATA_NORMAL, DATA_UNAVAILABLE, DATA_VALID]
    DATA_CORRUPTED: [DATA_VALIDATING, DATA_UNAVAILABLE, DATA_BOOT]
    DATA_UNAVAILABLE: [DATA_BOOT, DATA_VALIDATING]
    DATA_VALID: [DATA_VALIDATING, DATA_NORMAL, DATA_DEGRADED, DATA_STALE, DATA_CORRUPTED, DATA_UNAVAILABLE]

  FlowState:
    UNKNOWN: [LONG_EMERGING, SHORT_EMERGING, BALANCED, CONTESTED]
    LONG_EMERGING: [LONG_DOMINANT, LONG_WEAKENING, BALANCED, CONTESTED, TRANSITIONING, UNKNOWN]
    LONG_DOMINANT: [LONG_WEAKENING, CONTESTED, TRANSITIONING, UNKNOWN]
    LONG_WEAKENING: [LONG_DOMINANT, BALANCED, CONTESTED, SHORT_EMERGING, TRANSITIONING, UNKNOWN]
    BALANCED: [LONG_EMERGING, SHORT_EMERGING, CONTESTED, UNKNOWN]
    CONTESTED: [LONG_EMERGING, SHORT_EMERGING, BALANCED, TRANSITIONING, UNKNOWN]
    SHORT_EMERGING: [SHORT_DOMINANT, SHORT_WEAKENING, BALANCED, CONTESTED, TRANSITIONING, UNKNOWN]
    SHORT_DOMINANT: [SHORT_WEAKENING, CONTESTED, TRANSITIONING, UNKNOWN]
    SHORT_WEAKENING: [SHORT_DOMINANT, BALANCED, CONTESTED, LONG_EMERGING, TRANSITIONING, UNKNOWN]
    TRANSITIONING: [LONG_EMERGING, SHORT_EMERGING, BALANCED, CONTESTED, UNKNOWN]

  PDEState:
    PDE_NONE: [PDE_IMPULSE]
    PDE_IMPULSE: [PDE_PULLBACK_CANDIDATE, PDE_INVALIDATED]
    PDE_PULLBACK_CANDIDATE: [PDE_PULLBACK_ACTIVE, PDE_INVALIDATED]
    PDE_PULLBACK_ACTIVE: [PDE_WEAKENING, PDE_STRENGTHENING, PDE_INVALIDATED]
    PDE_WEAKENING: [PDE_RESUMPTION_IN_PROGRESS, PDE_STRENGTHENING, PDE_INVALIDATED]
    PDE_STRENGTHENING: [PDE_DEEPENING, PDE_WEAKENING, PDE_INVALIDATED]
    PDE_DEEPENING: [PDE_INVALIDATED]
    PDE_RESUMPTION_IN_PROGRESS: [PDE_FOLLOW_THROUGH, PDE_RESUMPTION_FAILED, PDE_INVALIDATED]
    PDE_FOLLOW_THROUGH: [PDE_NONE, PDE_INVALIDATED]
    PDE_RESUMPTION_FAILED: [PDE_INVALIDATED]
    PDE_INVALIDATED: []

  PDEResumptionState:
    RESUMPTION_NONE: [RECOVERY_CANDIDATE, DISPLACEMENT_CANDIDATE]
    RECOVERY_CANDIDATE: [RECOVERY_CONFIRMED, RESUMPTION_FAILED, RESUMPTION_NONE]
    RECOVERY_CONFIRMED: [DISPLACEMENT_CANDIDATE, RESUMPTION_CONFIRMED, RESUMPTION_FAILED]
    DISPLACEMENT_CANDIDATE: [RESUMPTION_CONFIRMED, RESUMPTION_FAILED, RESUMPTION_NONE]
    RESUMPTION_CONFIRMED: [FOLLOW_THROUGH, RESUMPTION_FAILED]
    FOLLOW_THROUGH: [RESUMPTION_NONE, RESUMPTION_FAILED]
    RESUMPTION_FAILED: [RESUMPTION_NONE, RECOVERY_CANDIDATE]

  RegimeState:
    UNKNOWN: [TREND_UP, TREND_DOWN, RANGE, TRANSITION, CHAOTIC]
    TREND_UP: [RANGE, TRANSITION, CHAOTIC, UNKNOWN]
    TREND_DOWN: [RANGE, TRANSITION, CHAOTIC, UNKNOWN]
    RANGE: [TREND_UP, TREND_DOWN, TRANSITION, CHAOTIC, UNKNOWN]
    TRANSITION: [TREND_UP, TREND_DOWN, RANGE, CHAOTIC, UNKNOWN]
    CHAOTIC: [TRANSITION, RANGE, UNKNOWN]

  RoleState:
    UNKNOWN: [CONTINUATION, PULLBACK, COUNTERFLOW, RANGE_ROTATION, BREAKOUT, RECLAIM, TRANSITION, EXHAUSTION, NOISE, AMBIGUOUS]
    CONTINUATION: [EXHAUSTION, PULLBACK, TRANSITION, AMBIGUOUS, UNKNOWN]
    PULLBACK: [CONTINUATION, COUNTERFLOW, TRANSITION, AMBIGUOUS, UNKNOWN]
    COUNTERFLOW: [RECLAIM, TRANSITION, AMBIGUOUS, UNKNOWN]
    RANGE_ROTATION: [BREAKOUT, TRANSITION, AMBIGUOUS, UNKNOWN]
    BREAKOUT: [CONTINUATION, RECLAIM, TRANSITION, NOISE, UNKNOWN]
    RECLAIM: [CONTINUATION, TRANSITION, UNKNOWN]
    TRANSITION: [CONTINUATION, RANGE_ROTATION, COUNTERFLOW, UNKNOWN]
    EXHAUSTION: [PULLBACK, TRANSITION, COUNTERFLOW, UNKNOWN]
    NOISE: [AMBIGUOUS, UNKNOWN]
    AMBIGUOUS: [CONTINUATION, PULLBACK, RANGE_ROTATION, TRANSITION, UNKNOWN]

  LocationState:
    OPEN: [FAVORABLE, NEUTRAL, CONGESTED, BLOCKED, EXTREME]
    FAVORABLE: [OPEN, NEUTRAL, CONGESTED, BLOCKED, EXTREME]
    NEUTRAL: [OPEN, FAVORABLE, CONGESTED, BLOCKED, EXTREME]
    CONGESTED: [NEUTRAL, OPEN, BLOCKED, EXTREME]
    BLOCKED: [CONGESTED, NEUTRAL, EXTREME, OPEN]
    EXTREME: [OPEN, FAVORABLE, NEUTRAL, CONGESTED, BLOCKED]

  MarketState:
    DISCOVERED: [CATALOGUED, UNAVAILABLE]
    CATALOGUED: [ELIGIBLE, BLOCKED, UNAVAILABLE]
    ELIGIBLE: [USER_SELECTED, BLOCKED, UNAVAILABLE]
    USER_SELECTED: [QUEUED, DORMANT, BLOCKED, UNAVAILABLE]
    QUEUED: [WARMING_UP, DORMANT, BLOCKED, UNAVAILABLE]
    WARMING_UP: [DATA_READY, DORMANT, BLOCKED, UNAVAILABLE]
    DATA_READY: [ACTIVE, DORMANT, BLOCKED, UNAVAILABLE]
    ACTIVE: [DORMANT, SUSPENDED, BLOCKED, UNAVAILABLE]
    DORMANT: [QUEUED, USER_SELECTED, BLOCKED, UNAVAILABLE]
    SUSPENDED: [ACTIVE, DORMANT, BLOCKED, UNAVAILABLE]
    BLOCKED: [CATALOGUED, ELIGIBLE, UNAVAILABLE]
    UNAVAILABLE: [DISCOVERED]

  NewsState:
    NEWS_NORMAL: [NEWS_WATCH]
    NEWS_WATCH: [NEWS_PREP, NEWS_NORMAL]
    NEWS_PREP: [NEWS_LOCKDOWN]
    NEWS_LOCKDOWN: [INITIAL_SHOCK]
    INITIAL_SHOCK: [VOLATILITY_DISCOVERY]
    VOLATILITY_DISCOVERY: [POST_NEWS_VALIDATION, EXTENDED_PROTECTION]
    POST_NEWS_VALIDATION: [RESTRICTED_REENTRY, EXTENDED_PROTECTION]
    RESTRICTED_REENTRY: [NORMAL_REENTRY, EXTENDED_PROTECTION]
    NORMAL_REENTRY: [NEWS_NORMAL]
    EXTENDED_PROTECTION: [POST_NEWS_VALIDATION, NEWS_NORMAL]

  ExecutionState:
    EXEC_READY: [EXEC_SUBMITTING, EXEC_REJECTED]
    EXEC_SUBMITTING: [EXEC_SUBMITTED, EXEC_UNKNOWN, EXEC_REJECTED]
    EXEC_SUBMITTED: [EXEC_ACCEPTED, EXEC_FILLED, EXEC_REJECTED, EXEC_UNKNOWN]
    EXEC_ACCEPTED: [EXEC_PARTIAL, EXEC_FILLED, EXEC_CANCELLED, EXEC_UNKNOWN]
    EXEC_PARTIAL: [EXEC_FILLED, EXEC_CANCELLED, EXEC_UNKNOWN]
    EXEC_FILLED: []
    EXEC_REJECTED: []
    EXEC_CANCELLED: []
    EXEC_UNKNOWN: [EXEC_RECONCILING]
    EXEC_RECONCILING: [EXEC_ACCEPTED, EXEC_FILLED, EXEC_REJECTED, EXEC_CANCELLED]

  RecoveryState:
    NORMAL: [RECOVERY_REQUIRED]
    RECOVERY_REQUIRED: [RECOVERING, RECONCILING, SAFE]
    RECOVERING: [RECONCILING, SAFE]
    RECONCILING: [RECOVERY_COMPLETE, SAFE]
    RECOVERY_COMPLETE: [NORMAL, RECOVERY_REQUIRED]
    SAFE: [RECOVERING, RECONCILING]

  OpportunityState:
    OPP_DISCOVERED: [OPP_VALIDATING, OPP_INVALIDATED]
    OPP_VALIDATING: [OPP_VALID, OPP_INVALIDATED]
    OPP_VALID: [OPP_TRIGGER_READY, OPP_DEGRADED, OPP_INVALIDATED, OPP_EXPIRED]
    OPP_TRIGGER_READY: [OPP_AUTHORIZED, OPP_DEGRADED, OPP_INVALIDATED, OPP_EXPIRED]
    OPP_AUTHORIZED: [OPP_EXECUTED, OPP_EXPIRED, OPP_INVALIDATED]
    OPP_EXECUTED: []
    OPP_DEGRADED: [OPP_VALID, OPP_INVALIDATED, OPP_EXPIRED]
    OPP_INVALIDATED: []
    OPP_STALE: [OPP_EXPIRED]
    OPP_EXPIRED: []

  EntryState:
    ENTRY_CREATED: [ENTRY_VALIDATING, ENTRY_INVALIDATED]
    ENTRY_VALIDATING: [ENTRY_ARMED, ENTRY_REJECTED, ENTRY_INVALIDATED]
    ENTRY_ARMED: [ENTRY_SUBMITTING, ENTRY_TRIGGERED, STOP_TRIGGERED, ENTRY_EXPIRED, ENTRY_INVALIDATED, ENTRY_STALE, ENTRY_CANCEL_REQUESTED]
    ENTRY_SUBMITTING: [ENTRY_ACCEPTED, ENTRY_UNKNOWN, ENTRY_REJECTED]
    ENTRY_ACCEPTED: [ENTRY_MONITORED, ENTRY_TRIGGERED, PARTIAL_FILL, ENTRY_FILLED, ENTRY_CANCELLED, ENTRY_UNKNOWN]
    ENTRY_MONITORED: [ENTRY_TRIGGERED, STOP_TRIGGERED, ENTRY_EXPIRED, ENTRY_INVALIDATED, ENTRY_STALE, ENTRY_CANCEL_REQUESTED]
    ENTRY_TRIGGERED: [STOP_TRIGGERED, LIMIT_ACTIVATED, ENTRY_SUBMITTING, PARTIAL_FILL, ENTRY_FILLED, ENTRY_EXPIRED, ENTRY_INVALIDATED]
    STOP_TRIGGERED: [LIMIT_ACTIVATED, ENTRY_SUBMITTING, PARTIAL_FILL, ENTRY_FILLED, ENTRY_EXPIRED, ENTRY_INVALIDATED]
    LIMIT_ACTIVATED: [ENTRY_SUBMITTING, PARTIAL_FILL, ENTRY_FILLED, ENTRY_EXPIRED, ENTRY_INVALIDATED]
    PARTIAL_FILL: [ENTRY_FILLED, ENTRY_CANCELLED, ENTRY_UNKNOWN, ENTRY_INVALIDATED]
    ENTRY_FILLED: []
    ENTRY_CANCEL_REQUESTED: [ENTRY_CANCELLED, ENTRY_UNKNOWN]
    ENTRY_CANCELLED: []
    ENTRY_EXPIRED: []
    ENTRY_INVALIDATED: []
    ENTRY_STALE: [ENTRY_CANCEL_REQUESTED, ENTRY_CANCELLED, ENTRY_EXPIRED, ENTRY_REPLACED]
    ENTRY_REPLACED: []
    ENTRY_REJECTED: []
    ENTRY_UNKNOWN: [ENTRY_RECONCILING]
    ENTRY_RECONCILING: [ENTRY_ACCEPTED, ENTRY_ARMED, PARTIAL_FILL, ENTRY_FILLED, ENTRY_CANCELLED, ENTRY_REJECTED]

  PositionLifecycleState:
    POS_OPENING: [POS_ACTIVE, POS_CLOSING]
    POS_ACTIVE: [POS_PROTECTED, POS_RUNNER, POS_DECAYING, POS_CLOSING]
    POS_PROTECTED: [POS_RUNNER, POS_DECAYING, POS_CLOSING]
    POS_RUNNER: [POS_DECAYING, POS_CLOSING]
    POS_DECAYING: [POS_EXPIRING, POS_CLOSING]
    POS_EXPIRING: [POS_CLOSING]
    POS_CLOSING: [POS_CLOSED]
    POS_CLOSED: []

  ReconciliationState:
    RECON_NORMAL: [RECON_SUSPECTED_ORPHAN]
    RECON_SUSPECTED_ORPHAN: [RECON_RECONCILING]
    RECON_RECONCILING: [RECON_RECOVERED, RECON_QUARANTINED]
    RECON_RECOVERED: [RECON_NORMAL]
    RECON_QUARANTINED: [RECON_NORMAL]
